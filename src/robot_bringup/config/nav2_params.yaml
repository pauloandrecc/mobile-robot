# Nav2 configuration for the mobile robot.
#
# Servers used by the default NavigateToPose behavior tree:
#   bt_navigator     — NavigateToPose action, runs the behavior tree
#   planner_server   — global path on the global costmap (NavFn / Dijkstra)
#   controller_server— follows the path on the local costmap; the controller
#                      plugin (DWB or MPPI) is in controller_<name>.yaml
#   behavior_server  — recoveries used by the tree (spin, back up, wait)
#
# Localization (map → odom), chosen with navigation.launch.py slam:=...
#   slam:=true  — slam_toolbox builds the map while the robot drives
#   slam:=false — map_server loads a saved map and AMCL localizes on it
#                 (amcl, map_server and lifecycle_manager_localization below)
# Odometry (odom → base_footprint) always comes from Gazebo's DiffDrive.
#
# Robot: 0.30 m long, ~0.30 m wide (wheels at y = ±0.13) → circumscribed
# radius ≈ 0.21 m; robot_radius 0.22 leaves a small margin.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # Only NavigateToPose: our waypoint server sends one pose at a time.
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    bt_search_directories:
      - $(find-pkg-share nav2_bt_navigator)/behavior_trees
    error_code_name_prefixes:
      - backup
      - compute_path
      - follow_path
      - nav_to_pose
      - spin
      - wait

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    odom_topic: odom
    # The Gazebo bridge expects geometry_msgs/Twist on /cmd_vel. Nav2 1.5
    # publishes TwistStamped by default, which the bridge would ignore.
    enable_stamped_cmd_vel: false
    # nav2_msgs/SpeedLimit published by waypoint_action_server
    speed_limit_topic: "/speed_limit"
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    path_handler_plugins: ["PathHandler"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal reached when the robot is within 0.15 m and ~8.6° of the goal.
    # Tightened from 0.25 m / 0.25 rad (Phase 4): the robot used to stop as
    # soon as it entered the 0.25 m circle, ~0.23 m short of the goal. On
    # the README route the final error went 0.23 m / 10° → 0.12 m / 7° at
    # no measurable cost in time.
    # stateful: once xy is reached, only the final rotation is checked.
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15
    PathHandler:
      plugin: "nav2_controller::FeasiblePathHandler"
      prune_distance: 2.0
    # FollowPath (the controller plugin itself) is in controller_dwb.yaml or
    # controller_mppi.yaml, chosen with navigation.launch.py controller:=...

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true    # 3x3 m window that moves with the robot
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.22
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          raytrace_max_range: 3.0
          obstacle_max_range: 2.5
      # Inflation: cells near obstacles get a cost that decays as
      #   cost = 252 * exp(-cost_scaling_factor * (d - robot_radius))
      # up to inflation_radius, then drops to 0. With 0.45 m / 3.0 the cost
      # fell from ~126 to 0 in one step, so paths hugged that edge. 0.6 m /
      # 4.0 ends in a gentler step (~55) and keeps paths further from
      # obstacles. Measured on the 3-waypoint README route (DWB + AMCL):
      #   0.45 m / 3.0 → 39 s     0.6 m / 4.0 → 37 s     0.8 m / 4.0 → 53 s
      # 0.8 m made wide detours around box_1 and slowed DWB near costly
      # cells. Narrowest gap in obstacles_world is ~2.6 m (box ↔ wall).
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.6
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # /map comes from slam_toolbox (slam:=true, grows over time) or
        # map_server (slam:=false, fixed); both publish it as transient
        # local ("latched"), so a late subscriber still gets it.
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          raytrace_max_range: 3.0
          obstacle_max_range: 2.5
      inflation_layer:         # same as local_costmap (see there)
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.6
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      # SLAM maps are partially unknown: allow planning through unknown
      # cells so goals in unexplored areas are still reachable.
      allow_unknown: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    enable_stamped_cmd_vel: false   # same reason as controller_server
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.0

# ── Localization on a saved map (slam:=false) ─────────────────────────

map_server:
  ros__parameters:
    # yaml_filename is set by navigation.launch.py (map:=...)
    frame_id: map

# AMCL = Adaptive Monte Carlo Localization. A particle filter: each particle
# is a guess of the robot pose in the map. On every motion (update_min_d /
# update_min_a) particles are moved with the odometry plus noise (alpha1-5),
# weighted by how well the Lidar scan, seen from that pose, matches the map
# (likelihood field), and resampled. The weighted mean becomes map → odom,
# the correction for the drift accumulated by odometry.
amcl:
  ros__parameters:
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: scan
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    tf_broadcast: true
    transform_tolerance: 1.0
    # Odometry noise model: how much rotation/translation error each motion
    # adds to the particles. Gazebo odometry is good, 0.2 is conservative.
    alpha1: 0.2   # rotation noise from rotation
    alpha2: 0.2   # rotation noise from translation
    alpha3: 0.2   # translation noise from translation
    alpha4: 0.2   # translation noise from rotation
    alpha5: 0.2   # (omni robots only)
    # Laser model: our Lidar is 360 beams, 0.12-10 m (gazebo.xacro)
    laser_model_type: "likelihood_field"
    laser_min_range: 0.12
    laser_max_range: 10.0
    max_beams: 60          # beams used per update (of 360), for speed
    laser_likelihood_max_dist: 2.0
    sigma_hit: 0.2
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    # Filter size (KLD sampling adapts between min and max)
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    # Update the filter only after moving 0.25 m or turning 0.2 rad
    update_min_d: 0.25
    update_min_a: 0.2
    save_pose_rate: 0.5
    random_seed: -1
    # The robot always spawns at the world origin, which is also the origin
    # of maps saved from a SLAM session started there. Seed the filter at
    # (0, 0, 0) so no manual "2D Pose Estimate" is needed; override it with
    # RViz's 2D Pose Estimate tool (/initialpose) if the robot is elsewhere.
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

lifecycle_manager_localization:
  ros__parameters:
    autostart: true
    node_names: ["map_server", "amcl"]
    bond_timeout: 4.0

# ── Navigation servers lifecycle ──────────────────────────────────────

lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    # Configured, then activated, in this order (and shut down in reverse)
    node_names: ["controller_server", "planner_server", "behavior_server",
                 "bt_navigator"]
    bond_timeout: 4.0
