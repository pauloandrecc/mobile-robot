# Gamepad teleoperation — GameSir Nova Lite (2.4 GHz receiver).
#
# The controller is read by joy's game_controller_node, which uses SDL's
# GameController database to normalize any known pad (Xbox, PlayStation,
# generic HID such as the Nova Lite in "Zikway HID gamepad" mode, ...)
# to the same standard layout:
#
#   Axes:    0 = left stick X      1 = left stick Y
#            2 = right stick X     3 = right stick Y
#            4 = LT                5 = RT
#   Buttons: 0 = A   1 = B   2 = X   3 = Y
#            4 = Back/Select   5 = Home   6 = Start
#            7 = L3   8 = R3   9 = LB   10 = RB
#            11 = D-pad up   12 = D-pad down   13 = D-pad left   14 = D-pad right
#
# To check the indices of your controller: ros2 topic echo /joy

game_controller_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.1           # ignore small stick drift
    autorepeat_rate: 20.0   # keep publishing while a stick is held (Hz)

teleop_twist_joy_node:
  ros__parameters:
    # Hold LB to drive (dead-man switch). Release it and the robot stops.
    require_enable_button: true
    enable_button: 9        # LB
    enable_turbo_button: 10 # RB — hold instead of LB for higher speed

    axis_linear:            # left stick vertical → forward/backward
      x: 1
    scale_linear:
      x: 0.3                # m/s
    scale_linear_turbo:
      x: 0.6                # m/s

    axis_angular:           # left stick horizontal → turn
      yaw: 0
    scale_angular:
      yaw: 1.0              # rad/s
    scale_angular_turbo:
      yaw: 1.5              # rad/s
