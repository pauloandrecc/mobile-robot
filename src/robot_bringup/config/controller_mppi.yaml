# Local controller: MPPI (Model Predictive Path Integral).
#
# Loaded on top of nav2_params.yaml by navigation.launch.py when
# controller:=mppi. Same robot limits as controller_dwb.yaml, so the two
# can be compared fairly.
#
# MPPI vs DWB:
#   DWB  — tries 400 *constant* (v, ω) arcs and keeps the cheapest one.
#   MPPI — keeps a whole control *sequence* (time_steps x model_dt = 2.8 s),
#          perturbs it with random noise into batch_size trajectories,
#          scores them with critics and replaces the sequence by their
#          cost-weighted average (softmax with `temperature`). The sequence
#          is warm-started from the previous cycle, so the motion is smooth
#          and it can plan curves that change direction (e.g. turn in place
#          then drive) without a RotationShim.
# Cost: ~2000 x 56 simulated states per cycle → much more CPU than DWB.

controller_server:
  ros__parameters:
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56            # horizon = 56 x 0.05 s = 2.8 s
      model_dt: 0.05            # = 1 / controller_frequency
      batch_size: 2000          # sampled trajectories per cycle
      iteration_count: 1
      temperature: 0.3          # lower = trust the best samples more
      gamma: 0.015
      motion_model: "diff_drive"
      diff_drive:
        plugin: "mppi::DiffDriveMotionModel"
      # Same limits as DWB (vx_max is lowered at runtime by /speed_limit).
      vx_max: 0.5
      vx_min: -0.2              # may back up a little; PreferForward penalizes it
      vy_max: 0.0
      wz_max: 1.0
      ax_max: 1.0
      ax_min: -1.0
      ay_max: 0.0
      ay_min: 0.0
      az_max: 2.0
      # Noise standard deviations used to perturb the control sequence
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4
      open_loop: false
      regenerate_noises: true
      visualize: true           # sampled trajectories on /trajectories
      publish_optimal_trajectory: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      TrajectoryValidator:
        plugin: "mppi::DefaultOptimalTrajectoryValidator"
        collision_lookahead_time: 2.0
        consider_footprint: false
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic",
                "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
                "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:         # respect the velocity limits
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:               # get close to the goal (when < 1.4 m away)
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:          # final heading
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:      # discourage driving backwards
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:               # stay away from inflated costmap cells
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:          # stay on top of the global path
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:         # make progress along the path
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:          # point towards the path ahead
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
